name: Build Mega Mobile (Android)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload .geode build
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Mobile-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
